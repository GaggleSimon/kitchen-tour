<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon's Bathroom Renders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Figtree:wght@400;500;600&display=swap">
<style>
:root { --bg:#f6f2ea; --ink:#2b2722; --muted:#7c7263; --line:#ddd3c3; --accent:#4d6f8c; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#171614; --ink:#efe8dc; --muted:#b0a593; --line:#4a453d; --accent:#93b5cf; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Figtree","Segoe UI",system-ui,sans-serif; }
header { max-width:1200px; margin:0 auto; padding:28px 16px 8px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
h1 { margin:0; font-family:"Libre Caslon Display",Georgia,serif; font-weight:400; font-size:2rem; }
nav a { color:var(--accent); text-decoration:none; font-weight:600; margin-left:16px; }
main { max-width:1200px; margin:0 auto; padding:8px 16px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr)); gap:20px; align-items:start; }
figure { margin:0; } img { width:100%; height:auto; display:block; border-radius:8px; border:1px solid var(--line); }
figcaption { margin-top:6px; font-size:0.86rem; color:var(--muted); }
</style>
</head>
<body>
<header><h1>Simon's Bathroom &middot; Renders</h1><nav><a href="../">360&deg; tour</a><a href="../drawings/">Drawings</a></nav></header>
<main>
  <figure><a href="doorway.jpg"><img src="doorway.jpg" alt="From the doorway" loading="lazy"></a><figcaption>From the doorway</figcaption></figure>
  <figure><a href="from_shower.jpg"><img src="from_shower.jpg" alt="From the shower, looking back" loading="lazy"></a><figcaption>From the shower, looking back</figcaption></figure>
  <figure><a href="window_wall.jpg"><img src="window_wall.jpg" alt="Window wall and the Carrara marble shower, champagne bronze Delta trim" loading="lazy"></a><figcaption>Window wall and the Carrara marble shower, champagne bronze Delta trim</figcaption></figure>
  <figure><a href="toilet_sconce.jpg"><img src="toilet_sconce.jpg" alt="Toilet and vanity" loading="lazy"></a><figcaption>Toilet and vanity</figcaption></figure>
  <figure><a href="vanity.jpg"><img src="vanity.jpg" alt="Vanity — 30&quot; traditional brown ash, Carrara top, brushed nickel faucet and knobs, Artika Royce LED mirror" loading="lazy"></a><figcaption>Vanity — 30&quot; traditional brown ash, Carrara top, brushed nickel faucet and knobs, Artika Royce LED mirror</figcaption></figure>
</main>
</body>
</html>
