<style>
:root{--paper:#fffdf9;--ink:#1d1b18;--muted:#6b665e;--line:#2a2724;--dim:#1d4f91;--accent:#4b6a88;--bg:#ebe7df;
--chrome:#fffdf9;--ui-fg:#1d1b18;--ui-hover:#f1ebe0;--ui-btn:#ffffff;--ui-border:#00000033}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1a18;--chrome:#2a2825;--ui-fg:#f3efe8;
--ui-hover:#3a3632;--ui-btn:#3a3632;--ui-border:#ffffff33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a18;--chrome:#2a2825;--ui-fg:#f3efe8;--ui-hover:#3a3632;--ui-btn:#3a3632;--ui-border:#ffffff33;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--chrome);color:var(--ui-fg);border-bottom:1px solid var(--ui-border);
padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:750;letter-spacing:.02em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a,.tools a{font-size:12.5px;text-decoration:none;color:var(--ui-fg);padding:5px 9px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
nav a:hover{border-color:var(--ui-border);background:var(--ui-hover)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tools a{border-color:var(--ui-border);background:var(--ui-btn)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:18px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.sheet{width:min(100%,1500px);background:var(--paper);box-shadow:0 2px 14px #0003;border-radius:2px;scroll-margin-top:70px}
.sheet svg{display:block;width:100%;height:auto}
svg text{fill:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif}
text.muted{fill:var(--muted)} text.warn{fill:#a2461d} text.disp{font-family:Georgia,"Times New Roman",serif}
text.dm{fill:var(--dim);font-weight:600} text.note{fill:#2f2c28;paint-order:stroke;stroke:#fffdf9;stroke-width:3px;stroke-linejoin:round} text.cl-t{fill:#8a3d3d;font-weight:600}
text.lbl{fill:var(--muted)} text.tagt{fill:#fff}
.border{fill:none;stroke:var(--line);stroke-width:1.4}.tb{fill:none;stroke:var(--line);stroke-width:1}
.frame{fill:none;stroke:#0004}
.ext{stroke:var(--dim);stroke-width:.5}.dl{stroke:var(--dim);stroke-width:.7}.tick{stroke:var(--dim);stroke-width:1.3}
.elv{fill:var(--dim)} .ldr{fill:none;stroke:#555;stroke-width:.6} .ldot{fill:#555}
.vt-c{fill:none;stroke:var(--ink);stroke-width:1.2}.vt-l{stroke:var(--ink);stroke-width:1.2}
.poche{fill:#5b5853;stroke:#2a2724;stroke-width:.6}
.wallface{fill:#e4e1da;stroke:none}

.navy,.navy-p{fill:#2f3d66;stroke:#141a2e;stroke-width:.6}
.antique,.antique-p{fill:#ece7dc;stroke:#6f6a62;stroke-width:.6}
.ash,.ash-p{fill:#c9b394;stroke:#6f5a40;stroke-width:.6}
.pencil{fill:#a9a7a0;stroke:#6f6a62;stroke-width:.4}
.subway{fill:#cfdde0;stroke:#6f6a62;stroke-width:.4}
.china{fill:#ffffff;stroke:#3a3835;stroke-width:.8}
.basin{fill:#f1f0ec;stroke:#777;stroke-width:.6}
.nickel{fill:#c9ccce;stroke:#55595c;stroke-width:.5}
.mirror{fill:#dfe8ec;stroke:#5d6a70;stroke-width:.6}
.trim{fill:#ffffff;stroke:#5c5852;stroke-width:.6}
.door{fill:#ffffff;stroke:#3a3835;stroke-width:.8}
.glass,.glass-p{fill:#cfe6ee;fill-opacity:.35;stroke:#6f95a6;stroke-width:.8}
.glass-e{fill:#9fc3c8;stroke:#6f95a6;stroke-width:.4}
.marble{fill:#f2ede4;stroke:#7d776d;stroke-width:.7}
.sconce{fill:#fff3d6;stroke:#8a7444;stroke-width:.7}
.brass{fill:#c9a86a;stroke:#7a5f2c;stroke-width:.5}
.dark{fill:#333}.amber{fill:#7a4a1e;stroke:#3d250f;stroke-width:.4}
.winglass{fill:#cfe0e6;stroke:#6f8a95;stroke-width:.4}.winglass-b{fill:#dbe8ea;stroke:#6f8a95;stroke-width:.6}
.winframe{fill:#fff;stroke:#5c5852;stroke-width:.6}.winline{stroke:#6f8a95;stroke-width:.8;fill:none}
.hexf{fill:#fbfbf8;stroke:#888;stroke-width:.4}.hexb{fill:#3a3937;stroke:#222;stroke-width:.4}
.bronze{fill:#d2b783;stroke:#7a6236;stroke-width:.5}
.niche{fill:#e9e3d6;stroke:#6f6a62;stroke-width:.8}
.hidden{fill:none;stroke:#444;stroke-width:.8;stroke-dasharray:5 3}.hiddenl{fill:none;stroke:#777;stroke-width:.8;stroke-dasharray:5 3}
.swing{fill:none;stroke:#777;stroke-width:.6;stroke-dasharray:4 3}
.cl{stroke:#8a3d3d;stroke-width:.6;stroke-dasharray:12 3 2 3;fill:none}
.can{fill:#fff;stroke:#2a2724;stroke-width:1}.can-in{fill:#fff6dd;stroke:#2a2724;stroke-width:.5}
.fan{fill:none;stroke:#2a2724;stroke-width:.8;stroke-dasharray:4 2}.fanx{stroke:#2a2724;stroke-width:.5;fill:none}
.tagb{fill:#3e5c7a}
.th{fill:#efe9de;stroke:var(--line);stroke-width:.6}.tr{stroke:#c9c1b3;stroke-width:.6}
@page{size:17in 11in;margin:0}
@media print{header{display:none}main{padding:0;gap:0}body{background:#fff}
.sheet{width:17in;height:11in;box-shadow:none;border-radius:0;break-after:page}.sheet svg{width:17in;height:11in}}
</style>

ext x="700.0" y="284.0" font-size="10.5" text-anchor="start">and vanity faucet Delta Saylor in Champagne Bronze; all other hardware</text><text x="700.0" y="300.0" font-size="10.5" text-anchor="start">Champagne Bronze to match.</text><text x="700.0" y="336.0" font-size="12" text-anchor="start" font-weight="700">GENERAL NOTES</text><text x="700.0" y="358.0" font-size="10" text-anchor="start" font-weight="700">1.</text><text x="718.0" y="358.0" font-size="10" text-anchor="start">Dimensions come from the design model (built from the owner&#x27;s SketchUp</text><text x="718.0" y="373.0" font-size="10" text-anchor="start">file). Field-verify every dimension before ordering or cutting; the room</text><text x="718.0" y="388.0" font-size="10" text-anchor="start">has not been field-measured for this set.</text><text x="700.0" y="411.0" font-size="10" text-anchor="start" font-weight="700">2.</text><text x="718.0" y="411.0" font-size="10" text-anchor="start">Plan dimensions are to finished wall faces. Heights are above finished</text><text x="718.0" y="426.0" font-size="10" text-anchor="start">floor (AFF).</text><text x="700.0" y="449.0" font-size="10" text-anchor="start" font-weight="700">3.</text><text x="718.0" y="449.0" font-size="10" text-anchor="start">Fixture sizes are the specified products&#x27; published dimensions; confirm</text><text x="718.0" y="464.0" font-size="10" text-anchor="start">rough-ins against the manufacturer spec sheets on site.</text><text x="700.0" y="487.0" font-size="10" text-anchor="start" font-weight="700">4.</text><text x="718.0" y="487.0" font-size="10" text-anchor="start">Toilet: 12&quot; rough-in, 15⅞&quot; from the shower jog wall to centerline and 15&quot;</text><text x="718.0" y="502.0" font-size="10" text-anchor="start">from the 30&quot; vanity&#x27;s side (the 15&quot; code minimum, IRC P2705 / IPC 405.3.1)</text><text x="718.0" y="517.0" font-size="10" text-anchor="start">-- do not widen the vanity.</text><text x="700.0" y="540.0" font-size="10" text-anchor="start" font-weight="700">5.</text><text x="718.0" y="540.0" font-size="10" text-anchor="start">Shower: provide waterproof membrane on all wet walls and the pan, sloped</text><text x="718.0" y="555.0" font-size="10" text-anchor="start">to the drain. Niche is recessed into the window-side wall, lined in the</text><text x="718.0" y="570.0" font-size="10" text-anchor="start">blue subway tile with a veined marble shelf.</text><text x="700.0" y="593.0" font-size="10" text-anchor="start" font-weight="700">6.</text><text x="718.0" y="593.0" font-size="10" text-anchor="start">Shower tile set-out: 2½×8 subway, horizontal running bond with a half-tile</text><text x="718.0" y="608.0" font-size="10" text-anchor="start">stagger, 1/8&quot; white joints, no liner. Start a full course on the curb</text><text x="718.0" y="623.0" font-size="10" text-anchor="start">line, centre the head joints on the back wall so the corner cuts match;</text><text x="718.0" y="638.0" font-size="10" text-anchor="start">cut row at the ceiling. Handmade-look tile: expect varied edges and glaze.</text><text x="700.0" y="661.0" font-size="10" text-anchor="start" font-weight="700">7.</text><text x="718.0" y="661.0" font-size="10" text-anchor="start">GFCI receptacle is required by code but not modeled — locate with the</text><text x="718.0" y="676.0" font-size="10" text-anchor="start">electrician. Exhaust: L-2 fan/light in the shower. MR-1 mirror has no</text><text x="718.0" y="691.0" font-size="10" text-anchor="start">power (no box needed).</text><text x="700.0" y="714.0" font-size="10" text-anchor="start" font-weight="700">8.</text><text x="718.0" y="714.0" font-size="10" text-anchor="start">Owner direction: no plant or vase on the vanity; vanity faucet Delta</text><text x="718.0" y="729.0" font-size="10" text-anchor="start">Saylor, Champagne Bronze.</text><text x="700.0" y="772.0" font-size="12" text-anchor="start" font-weight="700">SHEET INDEX</text><text x="700.0" y="796.0" font-size="10.5" text-anchor="start" font-weight="700">A-001</text><text x="760.0" y="796.0" font-size="10.5" text-anchor="start">Cover, notes &amp; index</text><text x="700.0" y="814.0" font-size="10.5" text-anchor="start" font-weight="700">A-101</text><text x="760.0" y="814.0" font-size="10.5" text-anchor="start">Floor plan — dimensioned</text><text x="700.0" y="832.0" font-size="10.5" text-anchor="start" font-weight="700">A-201</text><text x="760.0" y="832.0" font-size="10.5" text-anchor="start">Elevations — vanity / toilet wall &amp; door wall</text><text x="700.0" y="850.0" font-size="10.5" text-anchor="start" font-weight="700">A-202</text><text x="760.0" y="850.0" font-size="10.5" text-anchor="start">Elevations — window wall &amp; shower</text><text x="700.0" y="868.0" font-size="10.5" text-anchor="start" font-weight="700">A-401</text><text x="760.0" y="868.0" font-size="10.5" text-anchor="start">Reflected ceiling &amp; lighting plan</text><text x="700.0" y="886.0" font-size="10.5" text-anchor="start" font-weight="700">A-501</text><text x="760.0" y="886.0" font-size="10.5" text-anchor="start">Fixture &amp; finish schedule</text><text x="1456.0" y="44.0" font-size="16" text-anchor="start" font-weight="800">BATHROOM REMODEL</text><text x="1456.0" y="64.0" font-size="11" text-anchor="start">Simon&#x27;s Bathroom</text><text x="1456.0" y="84.0" font-size="11" text-anchor="start">Layout, fixtures &amp; finishes</text><text x="1456.0" y="118.0" font-size="10" text-anchor="start">Issued 2026-11-11</text><text x="1456.0" y="134.0" font-size="9.5" text-anchor="start" class="warn">For coordination — not for construction</text><text x="1456.0" y="188.0" font-size="10" text-anchor="start" font-weight="700">NOTES</text><text x="1456.0" y="206.0" font-size="9.5" text-anchor="start">Dimensions from the design model,</text><text x="1456.0" y="220.0" font-size="9.5" text-anchor="start">built from the owner&#x27;s SketchUp.</text><text x="1456.0" y="234.0" font-size="9.5" text-anchor="start">Verify all dimensions in field.</text><text x="1456.0" y="248.0" font-size="9.5" text-anchor="start">Do not scale drawings.</text><text x="1456.0" y="262.0" font-size="9.5" text-anchor="start">Heights are above finished floor.</text><text x="1456.0" y="276.0" font-size="9.5" text-anchor="start">Plan dims to finished wall faces.</text><text x="1456.0" y="915.0" font-size="12.5" text-anchor="start" font-weight="700">COVER, NOTES &amp; INDEX</text><text x="1456.0" y="933.0" font-size="9" text-anchor="start">Design intent, general notes and sheet</text><text x="1456.0" y="946.0" font-size="9" text-anchor="start">index</text><text x="1456.0" y="1070.0" font-size="30" text-anchor="start" font-weight="800">A-001</text><text x="1674.0" y="1070.0" font-size="10" text-anchor="end">1 of 6</text></svg></section>

10" text-anchor="start">Toilet centerline 1&#x27;-3⅞&quot; from the vanity side and</text><text x="1080.0" y="115.0" font-size="10" text-anchor="start">1&#x27;-3⅞&quot; from the jog wall (code min. 15&quot;). 2&#x27;-7⅛&quot;</text><text x="1080.0" y="130.0" font-size="10" text-anchor="start">clear in front (min. 21&quot;).</text><text x="1080.0" y="153.0" font-size="10" text-anchor="start">Sink centerline 1&#x27;-3&quot; from the door wall.</text><text x="1080.0" y="176.0" font-size="10" text-anchor="start">Shower inside 3&#x27;-2⅝&quot; × 3&#x27;-5½&quot; beyond a 4&quot; curb;</text><text x="1080.0" y="191.0" font-size="10" text-anchor="start">glass 5&#x27;-11½&quot; tall on the curb, door 1&#x27;-7⅛&quot; hinged</text><text x="1080.0" y="206.0" font-size="10" text-anchor="start">off the window-side wall.</text><text x="1080.0" y="229.0" font-size="10" text-anchor="start">Window rough opening 2&#x27;-10¼&quot; wide, sill 4&#x27;-6⅝&quot; AFF.</text><text x="1080.0" y="252.0" font-size="10" text-anchor="start">Door hinged on the window side; it opens flat</text><text x="1080.0" y="267.0" font-size="10" text-anchor="start">against the window-side wall.</text><text x="1080.0" y="290.0" font-size="10" text-anchor="start">One 4×4 tumbled marble checkerboard (White #7 / Cafe</text><text x="1080.0" y="305.0" font-size="10" text-anchor="start">Tenayo) runs under the vanity, over the curb and</text><text x="1080.0" y="320.0" font-size="10" text-anchor="start">through the shower on a single grid: a tile centred</text><text x="1080.0" y="335.0" font-size="10" text-anchor="start">on the room, a joint on the curb&#x27;s room edge so the</text><text x="1080.0" y="350.0" font-size="10" text-anchor="start">4&quot; curb top is one course; shower floor sloped to</text><text x="1080.0" y="365.0" font-size="10" text-anchor="start">the drain. Mix tiles from several boxes so no two</text><text x="1080.0" y="380.0" font-size="10" text-anchor="start">alike sit together.</text><text x="1
