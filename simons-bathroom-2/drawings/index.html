 over a 2-inch honed Arabescato Argento marble hexagon mosaic</text><text x="700.0" y="300.0" font-size="10.5" text-anchor="start">floor, behind clear frameless glass. Shower trim and vanity faucet Delta</text><text x="700.0" y="316.0" font-size="10.5" text-anchor="start">Saylor in Champagne Bronze; all other hardware Champagne Bronze to match.</text><text x="700.0" y="352.0" font-size="12" text-anchor="start" font-weight="700">GENERAL NOTES</text><text x="700.0" y="374.0" font-size="10" text-anchor="start" font-weight="700">1.</text><text x="718.0" y="374.0" font-size="10" text-anchor="start">Dimensions come from the design model (built from the owner&#x27;s SketchUp</text><text x="718.0" y="389.0" font-size="10" text-anchor="start">file). Field-verify every dimension before ordering or cutting; the room</text><text x="718.0" y="404.0" font-size="10" text-anchor="start">has not been field-measured for this set.</text><text x="700.0" y="427.0" font-size="10" text-anchor="start" font-weight="700">2.</text><text x="718.0" y="427.0" font-size="10" text-anchor="start">Plan dimensions are to finished wall faces. Heights are above finished</text><text x="718.0" y="442.0" font-size="10" text-anchor="start">floor (AFF).</text><text x="700.0" y="465.0" font-size="10" text-anchor="start" font-weight="700">3.</text><text x="718.0" y="465.0" font-size="10" text-anchor="start">Fixture sizes are the specified products&#x27; published dimensions; confirm</text><text x="718.0" y="480.0" font-size="10" text-anchor="start">rough-ins against the manufacturer spec sheets on site.</text><text x="700.0" y="503.0" font-size="10" text-anchor="start" font-weight="700">4.</text><text x="718.0" y="503.0" font-size="10" text-anchor="start">Toilet: 12&quot; rough-in, 15⅞&quot; from the shower jog wall to centerline and 15&quot;</text><text x="718.0" y="518.0" font-size="10" text-anchor="start">from the 30&quot; vanity&#x27;s side (the 15&quot; code minimum, IRC P2705 / IPC 405.3.1)</text><text x="718.0" y="533.0" font-size="10" text-anchor="start">-- do not widen the vanity.</text><text x="700.0" y="556.0" font-size="10" text-anchor="start" font-weight="700">5.</text><text x="718.0" y="556.0" font-size="10" text-anchor="start">Shower: provide waterproof membrane on all wet walls and the pan, sloped</text><text x="718.0" y="571.0" font-size="10" text-anchor="start">to the drain. Niche is recessed into the window-side wall, lined in the</text><text x="718.0" y="586.0" font-size="10" text-anchor="start">Marin tile with a veined marble shelf.</text><text x="700.0" y="609.0" font-size="10" text-anchor="start" font-weight="700">6.</text><text x="718.0" y="609.0" font-size="10" text-anchor="start">Shower tile set-out: 2×6 mosaic sheets, horizontal running bond with a</text><text x="718.0" y="624.0" font-size="10" text-anchor="start">half-tile stagger, no liner; keep the sheet joints invisible. Start a full</text><text x="718.0" y="639.0" font-size="10" text-anchor="start">course on the curb line, centre the head joints on the back wall so the</text><text x="718.0" y="654.0" font-size="10" text-anchor="start">corner cuts match; cut row at the ceiling. Handmade-look tile: expect</text><text x="718.0" y="669.0" font-size="10" text-anchor="start">varied edges and glaze.</text><text x="700.0" y="692.0" font-size="10" text-anchor="start" font-weight="700">7.</text><text x="718.0" y="692.0" font-size="10" text-anchor="start">GFCI receptacle is required by code but not modeled — locate with the</text><text x="718.0" y="707.0" font-size="10" text-anchor="start">electrician. Exhaust: L-2 fan/light in the shower. MR-1 mirror has no</text><text x="718.0" y="722.0" font-size="10" text-anchor="start">power (no box needed).</text><text x="700.0" y="745.0" font-size="10" text-anchor="start" font-weight="700">8.</text><text x="718.0" y="745.0" font-size="10" text-anchor="start">Owner direction: no plant or vase on the vanity; vanity faucet Delta</text><text x="718.0" y="760.0" font-size="10" text-anchor="start">Saylor, Champagne Bronze.</text><text x="700.0" y="803.0" font-size="12" text-anchor="start" font-weight="700">SHEET INDEX</text><text x="700.0" y="827.0" font-size="10.5" text-anchor="start" font-weight="700">A-001</text><text x="760.0" y="827.0" font-size="10.5" text-anchor="start">Cover, notes &amp; index</text><text x="700.0" y="845.0" font-size="10.5" text-anchor="start" font-weight="700">A-101</text><text x="760.0" y="845.0" font-size="10.5" text-anchor="start">Floor plan — dimensioned</text><text x="700.0" y="863.0" font-size="10.5" text-anchor="start" font-weight="700">A-201</text><text x="760.0" y="863.0" font-size="10.5" text-anchor="start">Elevations — vanity / toilet wall &amp; door wall</text><text x="700.0" y="881.0" font-size="10.5" text-anchor="start" font-weight="700">A-202</text><text x="760.0" y="881.0" font-size="10.5" text-anchor="start">Elevations — window wall &amp; shower</text><text x="700.0" y="899.0" font-size="10.5" text-anchor="start" font-weight="700">A-401</text><text x="760.0" y="899.0" font-size="10.5" text-anchor="start">Reflected ceiling &amp; lighting plan</text><text x="700.0" y="917.0" font-size="10.5" text-anchor="start" font-weight="700">A-501</text><text x="760.0" y="917.0" font-size="10.5" text-anchor="start">Fixture &amp; finish schedule</text><text x="1456.0" y="44.0" font-size="16" text-anchor="start" font-weight="800">BATHROOM REMODEL</text><text x="1456.0" y="64.0" font-size="11" text-anchor="start">Bathroom 2</text><text x="1456.0" y="84.0" font-size="11" text-anchor="start">Layout, fixtures &amp; finishes</text><text x="1456.0" y="118.0" font-size="10" text-anchor="start">Issued 2026-11-12</text><text x="1456.0" y="134.0" font-size="9.5" text-anchor="start" class="warn">For coordination — not for construction</text><text x="1456.0" y="188.0" font-size="10" text-anchor="start" font-weight="700">NOTES</text><text x="1456.0" y="206.0" font-size="9.5" text-anchor="start">Dimensions from the design model,</text><text x="1456.0" y="220.0" font-size="9.5" text-anchor="start">built from the owner&#x27;s SketchUp.</text><text x="1456.0" y="234.0" font-size="9.5" text-anchor="start">Verify all dimensions in field.</text><text x="1456.0" y="248.0" font-size="9.5" text-anchor="start">Do not scale drawings.</text><text x="1456.0" y="262.0" font-size="9.5" text-anchor="start">Heights are above finished floor.</text><text x="1456.0" y="276.0" font-size="9.5" text-anchor="start">Plan dims to finished wall faces.</text><text x="1456.0" y="915.0" font-size="12.5" text-anchor="start" font-weight="700">COVER, NOTES &amp; INDEX</text><text x="1456.0" y="933.0" font-size="9" text-anchor="start">Design intent, general notes and sheet</text><text x="1456.0" y="946.0" font-size="9" text-anchor="start">index</text><text x="1456.0" y="1070.0" font-size="30" text-anchor="start" font-weight="800">A-001</text><text x="1674.0" y="1070.0" font-size="10" text-anchor="end">1 of 6</text></svg></section>
