0" y="150.0" font-size="12" text-anchor="start" font-weight="700">DESIGN INTENT</text><text x="700.0" y="172.0" font-size="10.5" text-anchor="start">Classic bath with a weathered-fir vanity with woven-cane doors (Carrara marble</text><text x="700.0" y="188.0" font-size="10.5" text-anchor="start">top, undermount oval basin), a light grey concrete-look 4×12 porcelain floor</text><text x="700.0" y="204.0" font-size="10.5" text-anchor="start">in a herringbone, Benjamin Moore Classic Gray walls, white painted baseboards,</text><text x="700.0" y="220.0" font-size="10.5" text-anchor="start">under a bright white ceiling, and a walk-in shower in charcoal glossy zellige</text><text x="700.0" y="236.0" font-size="10.5" text-anchor="start">2×6 subway tile floor to ceiling, over a matte charcoal (Ebony) 4×4 shower</text><text x="700.0" y="252.0" font-size="10.5" text-anchor="start">floor, behind clear frameless glass. Shower trim and vanity faucet Delta</text><text x="700.0" y="268.0" font-size="10.5" text-anchor="start">Saylor in Champagne Bronze; all other hardware Champagne Bronze to match.</text><text x="700.0" y="304.0" font-size="12" text-anchor="start" font-weight="700">GENERAL NOTES</text><text x="700.0" y="326.0" font-size="10" text-anchor="start" font-weight="700">1.</text><text x="718.0" y="326.0" font-size="10" text-anchor="start">Dimensions come from the design model (built from the owner&#x27;s SketchUp</text><text x="718.0" y="341.0" font-size="10" text-anchor="start">file). Field-verify every dimension before ordering or cutting; the room</text><text x="718.0" y="356.0" font-size="10" text-anchor="start">has not been field-measured for this set.</text><text x="700.0" y="379.0" font-size="10" text-anchor="start" font-weight="700">2.</text><text x="718.0" y="379.0" font-size="10" text-anchor="start">Plan dimensions are to finished wall faces. Heights are above finished</text><text x="718.0" y="394.0" font-size="10" text-anchor="start">floor (AFF).</text><text x="700.0" y="417.0" font-size="10" text-anchor="start" font-weight="700">3.</text><text x="718.0" y="417.0" font-size="10" text-anchor="start">Fixture sizes are the specified products&#x27; published dimensions; confirm</text><text x="718.0" y="432.0" font-size="10" text-anchor="start">rough-ins against the manufacturer spec sheets on site.</text><text x="700.0" y="455.0" font-size="10" text-anchor="start" font-weight="700">4.</text><text x="718.0" y="455.0" font-size="10" text-anchor="start">Toilet: 12&quot; rough-in, 15⅞&quot; from the shower jog wall to centerline and 15&quot;</text><text x="718.0" y="470.0" font-size="10" text-anchor="start">from the 30&quot; vanity&#x27;s side (the 15&quot; code minimum, IRC P2705 / IPC 405.3.1)</text><text x="718.0" y="485.0" font-size="10" text-anchor="start">-- do not widen the vanity.</text><text x="700.0" y="508.0" font-size="10" text-anchor="start" font-weight="700">5.</text><text x="718.0" y="508.0" font-size="10" text-anchor="start">Shower: provide waterproof membrane on all wet walls and the pan, sloped</text><text x="718.0" y="523.0" font-size="10" text-anchor="start">to the drain. Niche is recessed into the window-side wall, lined in the</text><text x="718.0" y="538.0" font-size="10" text-anchor="start">charcoal 2×6 with a veined marble shelf.</text><text x="700.0" y="561.0" font-size="10" text-anchor="start" font-weight="700">6.</text><text x="718.0" y="561.0" font-size="10" text-anchor="start">Shower tile set-out: 2×6 laid horizontally in a half-offset running bond</text><text x="718.0" y="576.0" font-size="10" text-anchor="start">(subway), no liner. Centre each wall so the end cuts match (no slivers</text><text x="718.0" y="591.0" font-size="10" text-anchor="start">under 2&quot;); first joint on the pan, full 2&quot; rows up, cut row at the</text><text x="718.0" y="606.0" font-size="10" text-anchor="start">ceiling. Handmade-look tile: expect varied edges and glaze.</text><text x="700.0" y="629.0" font-size="10" text-anchor="start" font-weight="700">7.</text><text x="718.0" y="629.0" font-size="10" text-anchor="start">GFCI receptacle is required by code but not modeled — locate with the</text><text x="718.0" y="644.0" font-size="10" text-anchor="start">electrician. Exhaust: L-2 fan/light in the shower. MR-1 mirror has no</text><text x="718.0" y="659.0" font-size="10" text-anchor="start">power (no box needed).</text><text x="700.0" y="682.0" font-size="10" text-anchor="start" font-weight="700">8.</text><text x="718.0" y="682.0" font-size="10" text-anchor="start">Owner direction: no plant or vase on the vanity; vanity faucet Delta</text><text x="718.0" y="697.0" font-size="10" text-anchor="start">Saylor, Champagne Bronze.</text><text x="700.0" y="740.0" font-size="12" text-anchor="start" font-weight="700">SHEET INDEX</text><text x="700.0" y="764.0" font-size="10.5" text-anchor="start" font-weight="700">A-001</text><text x="760.0" y="764.0" font-size="10.5" text-anchor="start">Cover, notes &amp; index</text><text x="700.0" y="782.0" font-size="10.5" text-anchor="start" font-weight="700">A-101</text><text x="760.0" y="782.0" font-size="10.5" text-anchor="start">Floor plan — dimensioned</text><text x="700.0" y="800.0" font-size="10.5" text-anchor="start" font-weight="700">A-201</text><text x="760.0" y="800.0" font-size="10.5" text-anchor="start">Elevations — vanity / toilet wall &amp; door wall</text><text x="700.0" y="818.0" font-size="10.5" text-anchor="start" font-weight="700">A-202</text><text x="760.0" y="818.0" font-size="10.5" text-anchor="start">Elevations — window wall &amp; shower</text><text x="700.0" y="836.0" font-size="10.5" text-anchor="start" font-weight="700">A-401</text><text x="760.0" y="836.0" font-size="10.5" text-anchor="start">Reflected ceiling &amp; lighting plan</text><text x="700.0" y="854.0" font-size="10.5" text-anchor="start" font-weight="700">A-501</text><text x="760.0" y="854.0" font-size="10.5" text-anchor="start">Fixture &amp; finish schedule</text><tex
