qFSQcHqKs1XlBEu4dCOaTQ0PBqRTUINSA0kB//2Q==" preserveAspectRatio="xMidYMid slice"/><rect x="40" y="125" width="600" height="800" class="frame"/><text x="40.0" y="945.0" font-size="9.5" text-anchor="start" class="muted">Design rendering from the doorway (Blender / Cycles). Finishes are representative.</text><text x="700.0" y="150.0" font-size="12" text-anchor="start" font-weight="700">DESIGN INTENT</text><text x="700.0" y="172.0" font-size="10.5" text-anchor="start">Classic bath with a weathered-fir vanity with woven-cane doors (Carrara marble</text><text x="700.0" y="188.0" font-size="10.5" text-anchor="start">top, undermount oval basin), a white matte 4×5 hexagon porcelain floor with</text><text x="700.0" y="204.0" font-size="10.5" text-anchor="start">light warm gray grout, a solid white slab curb, Benjamin Moore Chantilly Lace</text><text x="700.0" y="220.0" font-size="10.5" text-anchor="start">walls, white painted baseboards, under a bright white ceiling, and a walk-in</text><text x="700.0" y="236.0" font-size="10.5" text-anchor="start">shower in muted navy glossy 2½×9 porcelain laid vertically in a staggered</text><text x="700.0" y="252.0" font-size="10.5" text-anchor="start">(vertical running bond) pattern with tight light joints, floor to ceiling,</text><text x="700.0" y="268.0" font-size="10.5" text-anchor="start">over a 1-inch honed White Carrara hexagon mosaic floor, behind clear frameless</text><text x="700.0" y="284.0" font-size="10.5" text-anchor="start">glass. Shower trim and vanity faucet Delta Saylor in Champagne Bronze; all</text><text x="700.0" y="300.0" font-size="10.5" text-anchor="start">other hardware Champagne Bronze to match.</text><text x="700.0" y="336.0" font-size="12" text-anchor="start" font-weight="700">GENERAL NOTES</text><text x="700.0" y="358.0" font-size="10" text-anchor="start" font-weight="700">1.</text><text x="718.0" y="358.0" font-size="10" text-anchor="start">Dimensions come from the design model (built from the owner&#x27;s SketchUp</text><text x="718.0" y="373.0" font-size="10" text-anchor="start">file). Field-verify every dimension before ordering or cutting; the room</text><text x="718.0" y="388.0" font-size="10" text-anchor="start">has not been field-measured for this set.</text><text x="700.0" y="411.0" font-size="10" text-anchor="start" font-weight="700">2.</text><text x="718.0" y="411.0" font-size="10" text-anchor="start">Plan dimensions are to finished wall faces. Heights are above finished</text><text x="718.0" y="426.0" font-size="10" text-anchor="start">floor (AFF).</text><text x="700.0" y="449.0" font-size="10" text-anchor="start" font-weight="700">3.</text><text x="718.0" y="449.0" font-size="10" text-anchor="start">Fixture sizes are the specified products&#x27; published dimensions; confirm</text><text x="718.0" y="464.0" font-size="10" text-anchor="start">rough-ins against the manufacturer spec sheets on site.</text><text x="700.0" y="487.0" font-size="10" text-anchor="start" font-weight="700">4.</text><text x="718.0" y="487.0" font-size="10" text-anchor="start">Toilet: 12&quot; rough-in, 15⅞&quot; from the shower jog wall to centerline and 15&quot;</text><text x="718.0" y="502.0" font-size="10" text-anchor="start">from the 30&quot; vanity&#x27;s side (the 15&quot; code minimum, IRC P2705 / IPC 405.3.1)</text><text x="718.0" y="517.0" font-size="10" text-anchor="start">-- do not widen the vanity.</text><text x="700.0" y="540.0" font-size="10" text-anchor="start" font-weight="700">5.</text><text x="718.0" y="540.0" font-size="10" text-anchor="start">Shower: provide waterproof membrane on all wet walls and the pan, sloped</text><text x="718.0" y="555.0" font-size="10" text-anchor="start">to the drain. Niche is recessed into the window-side wall, lined in the</text><text x="718.0" y="570.0" font-size="10" text-anchor="start">navy 2×6 with a veined marble shelf.</text><text x="700.0" y="593.0" font-size="10" text-anchor="start" font-weight="700">6.</text><text x="718.0" y="593.0" font-size="10" text-anchor="start">Shower tile set-out: 2×6 mosaic sheets, horizontal running bond with a</text><text x="718.0" y="608.0" font-size="10" text-anchor="start">half-tile stagger, no liner; keep the sheet joints invisible. Start a full</text><text x="718.0" y="623.0" font-size="10" text-anchor="start">course on the curb line, centre the head joints on the back wall so the</text><text x="718.0" y="638.0" font-size="10" text-anchor="start">corner cuts match; cut row at the ceiling. Handmade-look tile: expect</text><text x="718.0" y="653.0" font-size="10" text-anchor="start">varied edges and glaze.</text><text x="700.0" y="676.0" font-size="10" text-anchor="start" font-weight="700">7.</text><text x="718.0" y="676.0" font-size="10" text-anchor="start">GFCI receptacle is required by code but not modeled — locate with the</text><text x="718.0" y="691.0" font-size="10" text-anchor="start">electrician. Exhaust: L-2 fan/light in the shower. MR-1 mirror has no</text><text x="718.0" y="706.0" font-size="10" text-anchor="start">power (no box needed).</text><text x="700.0" y="729.0" font-size="10" text-anchor="start" font-weight="700">8.</text><text x="718.0" y="729.0" font-size="10" text-anchor="start">Owner direction: no plant or vase on the vanity; vanity faucet Delta</text><text x="718.0" y="744.0" font-size="10" text-anchor="start">Saylor, Champagne Bronze.</text><text x="700.0" y="787.0" font-size="12" text-anchor="start" font-weight="700">SHEET INDEX</text><text x="700.0" y="811.0" font-size="10.5" text-anchor="start" font-weight="700">A-001</text><text x="760.0" y="811.0" font-size="10.5" text-anchor="start">Cover, notes &amp; index</text><text x="700.0" y="829.0" font-size="10.5" text-anchor="start" font-weight="700">A-101</text><text x="760.0" y="829.0" font-size="10.5" text-anchor="start">Floor plan — dimensioned</text><text x="700.0" y="847.0" font-size="10.5" text-anchor="start" font-weight="700">A-201</text><text x="760.0" y="847.0" font-size="10.5"
