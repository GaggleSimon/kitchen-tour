<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Renders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Figtree:wght@400;500;600&display=swap">
<style>
:root { --bg:#f6f2ea; --ink:#2b2722; --muted:#7c7263; --line:#ddd3c3; --brass:#9c7135; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#171614; --ink:#efe8dc; --muted:#b0a593; --line:#4a453d; --brass:#d3a764; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Figtree","Segoe UI",system-ui,sans-serif; }
header { max-width:1200px; margin:0 auto; padding:28px 16px 8px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
h1 { margin:0; font-family:"Libre Caslon Display",Georgia,serif; font-weight:400; font-size:2rem; }
nav a { color:var(--brass); text-decoration:none; font-weight:600; margin-left:16px; }
main { max-width:1200px; margin:0 auto; padding:8px 16px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr)); gap:20px; }
figure { margin:0; } img { width:100%; height:auto; display:block; border-radius:8px; border:1px solid var(--line); }
figcaption { margin-top:6px; font-size:0.86rem; color:var(--muted); }
figure.wide { grid-column:1 / -1; }
</style>
</head>
<body>
<header><h1>Jane's Kitchen &middot; Renders</h1><nav><a href="../">360&deg; tour</a><a href="../drawings/">Drawings</a></nav></header>
<main>
  <figure class="wide"><a href="back_wall_elevation.jpg"><img src="back_wall_elevation.jpg" alt="Back wall elevation: the whole cabinet wall straight on, flat, wall to wall" loading="lazy"></a><figcaption>Back wall elevation (flat, straight on, wall to wall)</figcaption></figure>
  <figure><a href="front_elevation.jpg"><img src="front_elevation.jpg" alt="From the living room, straight on" loading="lazy"></a><figcaption>From the living room, straight on</figcaption></figure>
  <figure><a href="living_pov.jpg"><img src="living_pov.jpg" alt="Living room, standing" loading="lazy"></a><figcaption>Living room, standing</figcaption></figure>
  <figure><a href="stairs_pov.jpg"><img src="stairs_pov.jpg" alt="From the stairs" loading="lazy"></a><figcaption>From the stairs</figcaption></figure>
  <figure><a href="three-quarter_left.jpg"><img src="three-quarter_left.jpg" alt="Three-quarter, left" loading="lazy"></a><figcaption>Three-quarter, left</figcaption></figure>
  <figure><a href="three-quarter_right.jpg"><img src="three-quarter_right.jpg" alt="Three-quarter, right" loading="lazy"></a><figcaption>Three-quarter, right</figcaption></figure>
  <figure><a href="island_hero.jpg"><img src="island_hero.jpg" alt="Island and range" loading="lazy"></a><figcaption>Island and range</figcaption></figure>
  <figure><a href="toward_windows.jpg"><img src="toward_windows.jpg" alt="Toward the glass doors" loading="lazy"></a><figcaption>Toward the glass doors</figcaption></figure>
  <figure><a href="dining.jpg"><img src="dining.jpg" alt="From the dining area" loading="lazy"></a><figcaption>From the dining area</figcaption></figure>
</main>
</body>
</html>
