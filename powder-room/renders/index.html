<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powder Room Renders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Figtree:wght@400;500;600&display=swap">
<style>
:root { --bg:#f6f2ea; --ink:#2b2722; --muted:#7c7263; --line:#ddd3c3; --accent:#9c7135; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#171614; --ink:#efe8dc; --muted:#b0a593; --line:#4a453d; --accent:#d3a764; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Figtree","Segoe UI",system-ui,sans-serif; }
header { max-width:1200px; margin:0 auto; padding:28px 16px 8px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
h1 { margin:0; font-family:"Libre Caslon Display",Georgia,serif; font-weight:400; font-size:2rem; }
nav a { color:var(--accent); text-decoration:none; font-weight:600; margin-left:16px; }
main { max-width:1200px; margin:0 auto; padding:8px 16px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr)); gap:20px; align-items:start; }
figure { margin:0; } img { width:100%; height:auto; display:block; border-radius:8px; border:1px solid var(--line); }
figcaption { margin-top:6px; font-size:0.86rem; color:var(--muted); }
</style>
</head>
<body>
<header><h1>Powder Room A &middot; Renders</h1><nav><a href="../">360&deg; tour</a><a href="../../">Kitchen tour</a></nav></header>
<main>
  <figure><a href="a_doorway.jpg"><img src="a_doorway.jpg" alt="From the doorway" loading="lazy"></a><figcaption>From the doorway</figcaption></figure>
  <figure><a href="a_vanity.jpg"><img src="a_vanity.jpg" alt="Vanity wall: walnut serpentine 3-drawer vanity with a white quartz top and shaped backsplash, brass drop pulls and an 8-inch brass cross-handle faucet, under the Anthropologie Perla mirror in gold" loading="lazy"></a><figcaption>Vanity wall: walnut serpentine 3-drawer vanity with a white quartz top and shaped backsplash, brass drop pulls and an 8-inch brass cross-handle faucet, under the Anthropologie Perla mirror in gold</figcaption></figure>
  <figure><a href="a_toilet.jpg"><img src="a_toilet.jpg" alt="Kohler Adair one-piece elongated toilet (K-3946), white subway tile with a marble chair rail and a 6-inch painted baseboard, marble elongated-octagon floor with grey dots" loading="lazy"></a><figcaption>Kohler Adair one-piece elongated toilet (K-3946), white subway tile with a marble chair rail and a 6-inch painted baseboard, marble elongated-octagon floor with grey dots</figcaption></figure>
  <figure><a href="a_isometric.jpg"><img src="a_isometric.jpg" alt="Isometric cutaway with the door wall and ceiling lifted away: Hyacinth wallpaper above the tile, simple crown, and the 5-globe brass ceiling light" loading="lazy"></a><figcaption>Isometric cutaway with the door wall and ceiling lifted away: Hyacinth wallpaper above the tile, simple crown, and the 5-globe brass ceiling light</figcaption></figure>
</main>
</body>
</html>
